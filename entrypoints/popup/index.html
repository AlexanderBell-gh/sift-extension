<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sift</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F6F6F1;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      padding: 16px;
      background: #FFFFFF;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      width: 24px;
      height: 24px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .auth-prompt {
      padding: 24px 16px;
      text-align: center;
    }

    .auth-prompt-title {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
    }

    .auth-prompt-text {
      font-size: 13px;
      color: #6B7280;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-primary {
      background: #FF5701;
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: #E64D00;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .settings {
      padding: 16px;
    }

    .settings-section {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6B7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .form-select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      background: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #111827;
      cursor: pointer;
      appearance: none;
      transition: border-color 0.15s, background 0.15s, color 0.15s, box-shadow 0.15s;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='%236B7280' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 36px;
    }

    .form-select:hover {
      border-color: #FF5701;
      color: #FF5701;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .form-select:focus {
      outline: none;
      border-color: #FF5701;
      box-shadow: 0 0 0 3px rgba(255, 87, 1, 0.12);
    }

    .settings-links {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .settings-link {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #111827;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .settings-link:hover {
      background: #F6F6F1;
      color: #FF5701;
    }

    .settings-link-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      color: #6B7280;
    }

    .settings-link--danger {
      color: #DC2626;
    }

    .settings-link--danger:hover {
      background: rgba(220, 38, 38, 0.1);
      color: #DC2626;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
