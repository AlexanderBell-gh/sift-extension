<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sift</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F6F6F1;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      padding: 16px;
      background: #FFFFFF;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      width: 24px;
      height: 24px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .auth-prompt {
      padding: 24px 16px;
      text-align: center;
      animation: sift-popup-in 0.15s ease backwards;
    }

    @keyframes sift-popup-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-prompt-title {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
    }

    .auth-prompt-text {
      font-size: 13px;
      color: #6B7280;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 87, 1, 0.12);
    }

    .btn-primary {
      background: #FF5701;
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: #E64D00;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .settings {
      padding: 16px;
    }

    .settings-section {
      margin-bottom: 16px;
      animation: sift-popup-in 0.15s ease backwards;
    }

    .settings-section + .settings-links {
      animation-delay: 0.05s;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6B7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      transition: color 0.15s ease;
    }

    .settings-section:focus-within .field-label {
      color: #FF5701;
    }

    .pos-wrap {
      position: relative;
    }

    .pos-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      background: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #111827;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease, color 0.15s ease;
    }

    .pos-trigger span:first-child {
      flex: 1;
    }

    .pos-chevron {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6B7280;
      transition: transform 0.2s ease;
    }

    .pos-trigger:hover {
      border-color: #FF5701;
      color: #FF5701;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .pos-trigger[aria-expanded="true"] {
      border-color: #FF5701;
      box-shadow: 0 0 0 3px rgba(255, 87, 1, 0.12);
    }

    .pos-trigger[aria-expanded="true"] .pos-chevron {
      transform: rotate(180deg);
    }

    .pos-trigger:focus-visible {
      outline: none;
      border-color: #FF5701;
      box-shadow: 0 0 0 3px rgba(255, 87, 1, 0.12);
    }

    .pos-trigger:active {
      transform: scale(0.99);
    }

    .pos-panel {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
      animation: pos-slide-down 0.2s ease-out;
    }

    .pos-panel[hidden] {
      display: none;
    }

    @keyframes pos-slide-down {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pos-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: none;
      font-family: 'Inter', sans-serif;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .pos-option:hover {
      background: #F6F6F1;
      color: #FF5701;
    }

    .pos-option:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 87, 1, 0.12);
    }

    .pos-option-label {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
    }

    .pos-checkmark {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .settings-links {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: sift-popup-in 0.15s ease backwards;
    }

    .settings-link {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #111827;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .settings-link:hover {
      background: #F6F6F1;
      color: #FF5701;
    }

    .settings-link:hover .settings-link-icon {
      transform: translateX(2px);
    }

    .settings-link:active {
      transform: scale(0.99);
    }

    .settings-link:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 87, 1, 0.12);
    }

    .settings-link-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      color: #6B7280;
      transition: transform 0.15s ease;
    }

    .settings-link--danger {
      color: #DC2626;
    }

    .settings-link--danger:hover {
      background: rgba(220, 38, 38, 0.1);
      color: #DC2626;
    }

    @media (prefers-reduced-motion: reduce) {
      .auth-prompt,
      .settings-section,
      .settings-links {
        animation: none;
      }

      .btn,
      .pos-trigger,
      .pos-chevron,
      .pos-option,
      .settings-link,
      .settings-link-icon,
      .field-label {
        transition: none;
      }

      .pos-panel {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
